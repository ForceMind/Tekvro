# Serve only the public website. The default deployment is a workers.dev preview.
name = "tekvro-website-preview"
compatibility_date = "2026-10-08"
workers_dev = true
preview_urls = false

[assets]
directory = "./public"
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[build]
cwd = ".."
command = "python3 scripts/prepare-website.py && python3 scripts/verify-website.py"
watch_dir = "./public/examples/notes-electron"

# Public HTTPS depends on zone activation and certificate readiness.
[env.production]
name = "tekvro-website"
workers_dev = true
preview_urls = false
# No production domain or Cloudflare account is configured for Tekvro yet.

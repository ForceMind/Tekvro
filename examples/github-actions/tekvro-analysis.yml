# Copy to .github/workflows/tekvro-analysis.yml on your default branch.
name: Tekvro static analysis example

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      ARTIFACT_PATH: build/tekvro-ci-demo
    steps:
      - name: Prepare isolated report directory
        id: reports
        shell: bash
        run: |
          directory=$(mktemp -d "${RUNNER_TEMP:?}/tekvro-analysis.XXXXXX")
          printf 'directory=%s\n' "${directory}" >> "${GITHUB_OUTPUT:?}"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.22.1"
      - name: Install pinned Tekvro
        shell: bash
        run: |
          installer="${RUNNER_TEMP:?}/install-tekvro.sh"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --tlsv1.2 \
            https://raw.githubusercontent.com/ForceMind/Tekvro/v1.0.0/install.sh --output "${installer}"
          bash "${installer}" --version 1.0.0 --prefix "${RUNNER_TEMP}/tekvro-tool"
          printf '%s\n' "${RUNNER_TEMP}/tekvro-tool/bin" >> "${GITHUB_PATH:?}"
      - name: Build a known artifact
        id: build
        run: |
          # Replace this step with your reviewed build, keeping ARTIFACT_PATH in sync.
          mkdir -p build/tekvro-ci-demo
          printf '%s\n' '{"name":"tekvro-ci-demo","version":"1.0.0","type":"module","main":"index.js"}' > build/tekvro-ci-demo/package.json
          printf '%s\n' 'export const message = "hello";' 'throw new Error("This artifact must not be executed.");' > build/tekvro-ci-demo/index.js
      - name: Analyze and retain the original exit status
        id: analyze
        shell: bash
        env:
          REPORT_DIR: ${{ steps.reports.outputs.directory }}
        run: |
          set +e
          tekvro analyze-javascript-application "${GITHUB_WORKSPACE}/${ARTIFACT_PATH}" --json --full-output \
            > "${REPORT_DIR}/analysis.json" 2> "${REPORT_DIR}/analysis.stderr"
          status=$?
          set -e
          printf '%s\n' "${status}" > "${REPORT_DIR}/exit-code.txt"
          exit "${status}"
      - name: Upload available reports, including after analysis failure
        if: ${{ always() && steps.reports.outputs.directory != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tekvro-analysis
          path: ${{ steps.reports.outputs.directory }}
          if-no-files-found: warn
          retention-days: 7

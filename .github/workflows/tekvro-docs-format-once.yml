name: Tekvro one-time Chinese guide formatter
on:
  push:
    branches:
      - docs/tekvro-zh-js-h5-electron-20261012

permissions:
  contents: write

jobs:
  format:
    if: "github.repository == 'ForceMind/Tekvro' && github.event.head_commit.message == 'chore: apply Tekvro Chinese docs formatter'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format only new docs and VitePress navigation
        run: |
          ./node_modules/.bin/oxfmt docs/.vitepress/config.ts docs/zh-CN/javascript-h5-electron.md
      - name: Commit canonical formatting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/.vitepress/config.ts docs/zh-CN/javascript-h5-electron.md
          if ! git diff --cached --quiet; then
            git commit -m 'style: align Tekvro H5 Chinese guide formatting [skip ci]'
            git push origin HEAD:docs/tekvro-zh-js-h5-electron-20261012
          fi

name: One-time Tekvro localized CLI formatter

on:
  push:
    branches:
      - feat/tekvro-cli-help-zh-20261011

permissions:
  contents: write

jobs:
  format:
    if: "github.repository == 'ForceMind/Tekvro' && github.event.head_commit.message == 'chore: run Tekvro CLI localization formatter'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format localization files only
        run: |
          ./node_modules/.bin/oxfmt \
            src/cli.ts \
            src/cli/setupCommands.ts \
            src/cli/localization.ts \
            tests/boundary/cli/localizedSetupHelp.test.ts \
            docs/zh-CN/quick-start.md
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/cli.ts \
            src/cli/setupCommands.ts \
            src/cli/localization.ts \
            tests/boundary/cli/localizedSetupHelp.test.ts \
            docs/zh-CN/quick-start.md
          if ! git diff --cached --quiet; then
            git commit -m 'style: align Tekvro Chinese CLI help [skip ci]'
            git push origin HEAD:feat/tekvro-cli-help-zh-20261011
          fi

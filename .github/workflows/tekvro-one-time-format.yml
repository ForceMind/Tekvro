name: Tekvro one-time format baseline
on:
  push:
    branches:
      - chore/tekvro-format-baseline-20261011

permissions:
  contents: write

jobs:
  format:
    if: "github.repository == 'ForceMind/Tekvro' && github.event.head_commit.message == 'chore: run Tekvro formatting pass'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format only the 21 CI-listed files
        run: |
          ./node_modules/.bin/oxfmt \
            docs/.vitepress/config.ts \
            src/cli/interactiveSetup.ts \
            website/public/assets/main.js \
            website/public/faq/index.html \
            website/public/first-investigation/index.html \
            website/public/get-started/index.html \
            website/public/guides/browser/index.html \
            website/public/guides/index.html \
            website/public/guides/javascript/index.html \
            website/public/guides/native/index.html \
            website/public/index.html \
            website/public/showcase/aegis/index.html \
            website/public/showcase/ctf/index.html \
            website/public/showcase/dx-ball/index.html \
            website/public/showcase/index.html \
            website/public/showcase/notion/index.html \
            website/public/showcase/th04/index.html \
            website/public/zh-CN/faq/index.html \
            website/public/zh-CN/get-started/index.html \
            website/public/zh-CN/index.html \
            website/public/zh-CN/local.css
      - name: Commit canonical formatting only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            docs/.vitepress/config.ts \
            src/cli/interactiveSetup.ts \
            website/public/assets/main.js \
            website/public/faq/index.html \
            website/public/first-investigation/index.html \
            website/public/get-started/index.html \
            website/public/guides/browser/index.html \
            website/public/guides/index.html \
            website/public/guides/javascript/index.html \
            website/public/guides/native/index.html \
            website/public/index.html \
            website/public/showcase/aegis/index.html \
            website/public/showcase/ctf/index.html \
            website/public/showcase/dx-ball/index.html \
            website/public/showcase/index.html \
            website/public/showcase/notion/index.html \
            website/public/showcase/th04/index.html \
            website/public/zh-CN/faq/index.html \
            website/public/zh-CN/get-started/index.html \
            website/public/zh-CN/index.html \
            website/public/zh-CN/local.css
          if ! git diff --cached --quiet; then
            git commit -m 'style: normalize Tekvro formatting [skip ci]'
            git push origin HEAD:chore/tekvro-format-baseline-20261011
          fi

name: Tekvro identity one-time formatter
on:
  push:
    branches: [feat/tekvro-distribution-identity-20261011]
permissions:
  contents: write
jobs:
  format:
    if: "github.repository == 'ForceMind/Tekvro' && github.event.head_commit.message == 'chore: run Tekvro identity formatting'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Normalize touched files using pinned project oxfmt
        run: |
          ./node_modules/.bin/oxfmt \
            docs/zh-CN/distribution.md \
            scripts/lib/release-checkpoint.mjs \
            scripts/verify-package-install.mjs \
            scripts/verify-package-pack.mjs \
            scripts/verify-windows-package.mjs \
            src/application/ClientRegistrationIdentity.ts \
            src/application/Update.test.ts \
            tests/boundary/process/packagePackIsolation.test.ts
      - name: Commit style-only output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            docs/zh-CN/distribution.md \
            scripts/lib/release-checkpoint.mjs \
            scripts/verify-package-install.mjs \
            scripts/verify-package-pack.mjs \
            scripts/verify-windows-package.mjs \
            src/application/ClientRegistrationIdentity.ts \
            src/application/Update.test.ts \
            tests/boundary/process/packagePackIsolation.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'style: align Tekvro distribution metadata tests [skip ci]'
            git push origin HEAD:feat/tekvro-distribution-identity-20261011
          fi

name: Validate REA 6.5.0 Tekvro integration and clean formatting

on:
  push:
    branches:
      - integration/rea-6.5.0-engine-prototype-20261015
    paths:
      - .github/workflows/integration-finish-rea-650.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.repository == 'ForceMind/Tekvro'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
      - name: Check final migrated code and expected updater refusal
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@11.16.0
          npm ci
          git rm -- .github/workflows/integration-finish-rea-650.yml
          npx oxfmt tests/boundary/cli/tekvroPrivateSourceUpdate.test.ts docs/upstream/rea-6.5.0-integration-prototype.md
          report='docs/upstream/rea-6.5.0-integration-prototype.md'
          printf '\n### 合并前迭代 4：格式、明确更新拒绝与文档契约\n' >> "$report"
          logs="$RUNNER_TEMP/rea650-final-validation"
          mkdir -p "$logs"
          failure=0
          check() {
            local name="$1"; shift
            local slug="${name//[^[:alnum:]]/_}"
            local rc=0
            "$@" >"$logs/$slug.log" 2>&1 || rc=$?
            if [ "$rc" -eq 0 ]; then echo "- \`$name\`: **通过**" >> "$report"; else
              echo "- \`$name\`: **失败（exit $rc）**，详情见本次工作流记录" >> "$report"
              failure=1
              echo "--- $name ---"; tail -n 55 "$logs/$slug.log" || true
            fi
          }
          check 'npm run build:cached' npm run build:cached
          check 'npm run test:focused -- tests/boundary/cli/tekvroPrivateSourceUpdate.test.ts' npm run test:focused -- tests/boundary/cli/tekvroPrivateSourceUpdate.test.ts
          check 'npm run docs:check' npm run docs:check
          npx oxfmt "$report"
          check 'npm run format:check' npm run format:check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/boundary/cli/tekvroPrivateSourceUpdate.test.ts "$report"
          git commit -m 'test(engine): validate safe update refusal and format integrated 6.5.0 source'
          git push origin HEAD:refs/heads/integration/rea-6.5.0-engine-prototype-20261015
          if [ "$failure" -ne 0 ]; then exit 1; fi
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tekvro-rea650-validation-logs
          path: ${{ runner.temp }}/rea650-final-validation/*.log
          if-no-files-found: ignore

name: Tekvro one-time H5 help check

on:
  push:
    branches:
      - feat/tekvro-h5-electron-cli-help-20261013

permissions:
  contents: write

jobs:
  focused-check:
    if: "github.repository == 'ForceMind/Tekvro' && github.event.head_commit.message == 'chore: start Tekvro H5 help validation'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply repository formatter to changed files only
        run: |
          ./node_modules/.bin/oxfmt \
            src/cli/electronCommands.ts \
            src/cli/javascriptRecoveryCommands.ts \
            src/cli/browserCommands.ts \
            src/cli/webScriptCommands.ts \
            src/cliObservationOptions.ts \
            tests/boundary/cli/localizedJavaScriptHelp.test.ts \
            docs/zh-CN/javascript-h5-electron.md
      - name: Commit canonical formatting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            src/cli/electronCommands.ts \
            src/cli/javascriptRecoveryCommands.ts \
            src/cli/browserCommands.ts \
            src/cli/webScriptCommands.ts \
            src/cliObservationOptions.ts \
            tests/boundary/cli/localizedJavaScriptHelp.test.ts \
            docs/zh-CN/javascript-h5-electron.md
          if ! git diff --cached --quiet; then
            git commit -m 'style: align H5/Electron bilingual CLI help [skip ci]'
            git push origin HEAD:feat/tekvro-h5-electron-cli-help-20261013
          fi
      - name: Build original full analysis engine
        run: npm run build:cached
      - name: Run focused bilingual CLI help regressions
        run: ./node_modules/.bin/vitest run --project boundary tests/boundary/cli/localizedJavaScriptHelp.test.ts

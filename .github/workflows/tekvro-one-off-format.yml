name: Tekvro one-time style normalization

on:
  push:
    branches: [chore/tekvro-brand-zh-20261010]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'ForceMind/REA' && github.event.head_commit.message == 'chore: run Tekvro formatting pass'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Apply project formatter only to the Tekvro change set
        run: |
          ./node_modules/.bin/oxfmt \
            README.md README.en.md README_zh.md \
            PROJECT_MAINTENANCE.md CHANGELOG.md THIRD_PARTY_NOTICES.md \
            docs/index.md docs/.vitepress/config.ts docs/roadmap.md docs/installation.md docs/BRAND.md \
            docs/zh-CN/quick-start.md docs/zh-CN/architecture.md docs/zh-CN/faq.md docs/zh-CN/security.md \
            src/cli/interactiveSetup.ts scripts/rea.mjs src/identity.ts \
            scripts/lib/docs-facts.mjs tests/conformance/readmeConsistency.test.ts \
            SECURITY.md .github/pull_request_template.md
      - name: Commit formatting if needed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- README.md README.en.md README_zh.md PROJECT_MAINTENANCE.md CHANGELOG.md THIRD_PARTY_NOTICES.md \
            docs/index.md docs/.vitepress/config.ts docs/roadmap.md docs/installation.md docs/BRAND.md \
            docs/zh-CN/quick-start.md docs/zh-CN/architecture.md docs/zh-CN/faq.md docs/zh-CN/security.md \
            src/cli/interactiveSetup.ts scripts/rea.mjs src/identity.ts \
            scripts/lib/docs-facts.mjs tests/conformance/readmeConsistency.test.ts \
            SECURITY.md .github/pull_request_template.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: apply Tekvro canonical project formatting [skip ci]'
            git push origin HEAD:chore/tekvro-brand-zh-20261010
          fi

name: One-time Tekvro release test formatting
on:
  push:
    branches:
      - chore/tekvro-brand-zh-20261010

permissions:
  contents: write

jobs:
  format:
    if: "github.repository == 'ForceMind/REA' && github.event.head_commit.message == 'chore: format Tekvro release guard test'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format the release test
        run: ./node_modules/.bin/oxfmt tests/boundary/filesystem/releaseWorkflow.test.ts
      - name: Commit normalized formatting
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- tests/boundary/filesystem/releaseWorkflow.test.ts
          if ! git diff --cached --quiet; then
            git commit -m 'chore: normalize Tekvro release guard test [skip ci]'
            git push origin HEAD:chore/tekvro-brand-zh-20261010
          fi

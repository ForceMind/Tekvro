name: One-time verified REA source import

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-source:
    if: "github.repository == 'ForceMind/REA' && github.event.head_commit.message == 'chore: bootstrap verified source import'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout bootstrap
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find exact upstream commit and import with history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/morluto/rea.git
          git fetch --no-tags upstream main

          matched_sha="$(python3 - <<'PY'
          import hashlib
          import subprocess
          import sys

          expected_count = 2318
          expected_fingerprint = "c1d61fce26e43e373ff10d66e91d76e8b18eb1a0a659537bcf6e4fcd554e2480"
          sample_hashes = {
              "package.json": "ef3ac0893e0b739fd767f85bd200d9c96ba0acc4",
              "README.md": "13bbdf4d77b84187e8c539fba5becabc374a3e98",
              ".github/workflows/ci.yml": "14f8f42c55b6a041c2f7de8983aac6b9727ff4b8",
          }

          def output(*args):
              try:
                  return subprocess.check_output(["git", *args], stderr=subprocess.DEVNULL).strip()
              except subprocess.CalledProcessError:
                  return b""

          candidates = output("rev-list", "--first-parent", "--max-count=6000", "upstream/main").decode().splitlines()
          for i, rev in enumerate(candidates):
              if i % 250 == 0:
                  print(f"Inspecting upstream revision {i + 1} of {len(candidates)}", file=sys.stderr)
              if any(output("rev-parse", "--verify", f"{rev}:{path}").decode() != sha for path, sha in sample_hashes.items()):
                  continue
              raw = subprocess.check_output(["git", "ls-tree", "-r", "-z", "--full-tree", rev])
              entries = []
              for record in raw.split(b"\0"):
                  if not record:
                      continue
                  metadata, path = record.split(b"\t", 1)
                  mode, kind, sha = metadata.split(b" ")
                  if kind == b"blob":
                      entries.append((path, sha))
              if len(entries) != expected_count:
                  continue
              entries.sort(key=lambda item: item[0])
              payload = b"".join(path + b"\0" + sha + b"\n" for path, sha in entries)
              actual = hashlib.sha256(payload).hexdigest()
              if actual == expected_fingerprint:
                  print(f"Verified exact archived source at upstream {rev}", file=sys.stderr)
                  print(rev)
                  break
          else:
              print("No exact upstream revision matches archive manifest. Aborting without pushing source.", file=sys.stderr)
              sys.exit(1)
          PY
          )"
          test -n "$matched_sha"
          git merge --allow-unrelated-histories --no-ff --no-edit \
            -m "chore: import verified upstream REA source 6.1.0 [skip ci]" "$matched_sha"
          git rm .github/workflows/rea-bootstrap-import.yml
          git commit -m "chore: finalize verified source import [skip ci]"
          git push origin HEAD:main

name: One-time Tekvro MCP formatting
on:
  push:
    branches: [fix/tekvro-local-mcp-add-20261011]
permissions:
  contents: write
jobs:
  format:
    if: "github.repository == 'ForceMind/Tekvro' && github.event.head_commit.message == 'chore: run Tekvro mcp formatting'"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format only two changed files
        run: ./node_modules/.bin/oxfmt src/cli.ts scripts/verify-package-setup.mjs
      - name: Commit formatter result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/cli.ts scripts/verify-package-setup.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'style: normalize Tekvro MCP registration [skip ci]'
            git push origin HEAD:fix/tekvro-local-mcp-add-20261011
          fi

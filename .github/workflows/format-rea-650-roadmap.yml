name: Format REA upgrade planning documents once

on:
  push:
    branches:
      - docs/rea-6.4.0-upgrade-plan-20261014
    paths:
      - .github/workflows/format-rea-650-roadmap.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'ForceMind/Tekvro'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Format the exact existing migration document
        run: npx oxfmt docs/zh-CN/rea-6.4.0-upgrade-plan.md
      - name: Commit the format fix and remove this temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/zh-CN/rea-6.4.0-upgrade-plan.md
          git rm -- .github/workflows/format-rea-650-roadmap.yml
          git commit -m 'style(docs): format REA migration guide with oxfmt'
          git push origin HEAD:refs/heads/docs/rea-6.4.0-upgrade-plan-20261014

name: Import pinned REA 6.5.0 source for research

on:
  push:
    branches:
      - research/rea-6.5.0-source-20261015
    paths:
      - .github/workflows/research-import-rea-650.yml

permissions:
  contents: write

jobs:
  import:
    if: github.repository == 'ForceMind/Tekvro'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out isolated research branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Copy pinned Git-tracked REA 6.5.0 files and compare versions
        shell: bash
        env:
          UPSTREAM_GIT_DIR: ${{ runner.temp }}/rea-650-upstream
        run: |
          set -euo pipefail
          git clone --depth 1 --branch rea-agents-6.5.0 https://github.com/morluto/rea.git "$UPSTREAM_GIT_DIR"
          actual="$(git -C "$UPSTREAM_GIT_DIR" rev-parse HEAD)"
          test "$actual" = "3b79af28e80785afce9f5998d8f03289402a1847"
          mkdir -p upstream/rea-6.5.0
          git -C "$UPSTREAM_GIT_DIR" archive --format=tar HEAD | tar -xf - -C upstream/rea-6.5.0
          test -f upstream/rea-6.5.0/package.json
          test -f upstream/rea-6.5.0/LICENSE
          PYTHONDONTWRITEBYTECODE=1 python3 scripts/research/audit_rea_650.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f upstream/rea-6.5.0 docs/upstream/rea-6.5.0-delta.md docs/upstream/rea-6.5.0-file-diff.tsv
          git rm -- .github/workflows/research-import-rea-650.yml
          git commit -m 'chore(research): copy pinned REA 6.5.0 source and record file delta'
          git push origin HEAD:refs/heads/research/rea-6.5.0-source-20261015
          echo 'REA 6.5.0 source snapshot is available in the isolated research branch.'
